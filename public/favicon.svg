<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#153e46" />
      <stop offset="50%" stop-color="#0b2227" />
      <stop offset="100%" stop-color="#061114" />
    </radialGradient>

    <!-- Symbol Cyan/Teal Gradient -->
    <linearGradient id="flowGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="45%" stop-color="#2dd4bf" />
      <stop offset="100%" stop-color="#7ce3e8" />
    </linearGradient>

    <!-- Ambient Glow Filter -->
    <filter id="glowFilter" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle App Container -->
  <rect x="8" y="8" width="496" height="496" rx="112" fill="url(#bgGrad)" stroke="#7ce3e8" stroke-opacity="0.22" stroke-width="3" />

  <!-- Ambient Glow Behind Symbol -->
  <circle cx="256" cy="256" r="140" fill="#2dd4bf" opacity="0.28" filter="url(#glowFilter)" />

  <!-- Flowchart Logo Symbol -->
  <g transform="translate(96, 96) scale(3.37)" filter="url(#glowFilter)">
